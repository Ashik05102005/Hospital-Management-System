{% extends 'base.html' %}

{% block content %}

    <style>
        input{
            border : 1px solid gray ;
            padding :8px ;
    
            display : block ;
            width: 100%;
            border-radius: 5px;
        }
    </style>
    <div class="flex justify-center items-center ">
        <form method="post" class="border rounded-md p-5 grid gap-3 m-10 w-1/3 p-5">
            <h1 class="text-3xl font-medium text-[#0F766E] ">Register</h1>
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" 
            class="bg-[#0F766E] py-2 mt-4 rounded-md text-white font-semibold"
            >Register</button>
            {%if error %}
            <p class="text-sm text-red-500">{{error}}</p>
            {% endif %}
            <a 
            class="font-semibold"
            href="{% url 'login' %}">Already have an <span class="text-[#0F766E]">account</span> ?</a>
        </form>
    </div>
