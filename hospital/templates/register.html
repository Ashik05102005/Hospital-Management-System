{% extends 'base.html' %}

{% block content %}
    <div class="max-w-full w-full h-full flex justify-center items-center ">
        <form method="post" class="shadow rounded-xl grid gap-5 w-1/3 p-5 mt-10">

            {% csrf_token %}

            <h1 class="text-4xl font-semibold">Register</h1>

            <label>User name</label>
            {%if error %}

            <p class="text-sm text-red-500">{{error}}</p>

            {% endif %}

            <input 
            type="text" 
            name="username"
            placeholder="User name"
            class="border border-gray-400 py-2 px-4 rounded-md outline-none"/>

            <label>Email</label>
            <input 
            type="email" 
            name="email"
            placeholder="Email"
            class="border border-gray-400 py-2 px-4 rounded-md outline-none"/>

            <label>Password</label>
            <input 
            type="password" 
            name="password"
            placeholder="Password"
            class="border border-gray-400 py-2 px-4 rounded-md outline-none"/>

            <button 
            type="submit" 
            class="bg-[#0F766E] text-white font-semibold rounded-md hover:scale(1.1) py-2 text-xl">
            craete User</button>

            <a 
            class="font-semibold"
            href="{% url 'login' %}">Already have an account ?</a>

        </form>
    
    </div>

{% endblock %}
