{% extends 'base.html' %}

{% block content %}
    {% if form %}
        <style>
            input{
                border : 1px solid gray ;
                padding :8px ;

                display : block ;
                width: 100%;
                border-radius: 5px;
            }
        </style>

        <div class="flex justify-center items-center ">
            <form method="post" class="border rounded-md p-5 grid gap-3 m-10 w-1/3 p-5">
                <h1 class="text-3xl font-medium text-[#0F766E] ">Update Form</h1>
            <!-- <h1>Update Form</h1> -->
            {% csrf_token %}
            {{form.as_p}}
            <button
            class="bg-[#0F766E] py-2 mt-4 rounded-md text-white font-semibold"
            type="submit">Update</button>
        </form>
        </div>
    {% else %}
        <div class="max-w-md mx-auto mt-10 bg-white shadow-lg rounded-xl p-6">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
                My Profile
            </h2>

            <div class="space-y-4">
                <div class="flex justify-between border-b pb-2">
                    <span class="font-semibold text-gray-600">Username</span>
                    <span class="text-gray-800">{{ user.username }}</span>
                </div>

                <div class="flex justify-between border-b pb-2">
                    <span class="font-semibold text-gray-600">Email</span>
                    <span class="text-gray-800">{{ user.email }}</span>
                </div>

                <div class="flex justify-between border-b pb-2">
                    <span class="font-semibold text-gray-600">Phone</span>
                    <span class="text-gray-800">{{ data.phone }}</span>
                </div>

                <div class="flex justify-between">
                    <span class="font-semibold text-gray-600">Address</span>
                    <span class="text-gray-800 text-right">{{ data.address }}</span>
                </div>
            </div>
        </div>
    {% endif %}

{% endblock %}
