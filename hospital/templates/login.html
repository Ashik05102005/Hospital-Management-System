{% extends 'base.html' %}

{%  block content %}

<div class="flex justify-center">
    <form 
    method="post"
    class="grid gap-5 w-1/3 mt-20 shadow rounded-xl p-5">
        {% csrf_token %}

        <h1 class="text-4xl font-semibold">Login</h1>

        <div class="grid ">
            <label>User name </label>
            <input 
            name="username"
            class="py-2 px-4 border border-gray-400 rounded-md outline-none "
            type="text" >
        </div>

        <div class="grid ">
            <label>Password </label>
            <input 
            name="password"
            class="py-2 px-4 border border-gray-400 rounded-md outline-none "
            type="password" >
        </div>

        <button 
        type="submit"
        class="bg-[#0F766E] text-white font-semibold rounded-md hover:scale(1.1) py-2 text-xl mb-6"
        >Login</button>

        {% if error %}
        <p class="text-sm text-red-500">{{error}}</p>
        {% endif %}

        <a 
            class="font-semibold"
            href="{% url 'register' %}">You dont have an <span class="text-[#0F766E]">Account</span>?</a>

    </form>
</div>

{% endblock %}
