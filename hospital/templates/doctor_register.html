{% extends 'base.html' %}

{% block content %}

<style>
    input{
        border : 1px solid gray ;
        padding :8px ;
        display : block ;
        width: 100%;
        border-radius: 5px;
    }


</style>


<div class="flex justify-center ">
    <form 
    class="lg:w-1/3  border rounded-xl p-5 grid gap-4 my-10"
    method="post">

        <h1 class="text-4xl text-[#0F766E] font-semibold">Doctor Register</h1>

        {% csrf_token %}

        {{ form.as_p }}

        <button 
        class="bg-[#0F766E] text-white font-semibold rounded-lg p-2 my-8"
        type="submit">Submit</button>

    </form>
</div>

{% endblock %}
