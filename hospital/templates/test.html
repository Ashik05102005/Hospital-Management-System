{% extends 'base.html' %}

{% block content %}
<style>
    input{
        border : 1px solid gray ;
        padding :8px ;

        display : block ;
        width: 100%;
        border-radius: 5px;
    }
</style>

{% comment %}
 <!-- {{doctor}} -->
<h1 class="p-5 text-5xl font-semibold text-[#0F766E]">{{doctor.name.upper}}</h1>
<div class="grid grid-cols-4 gap-10 p-5">
    {% for patient in doctor_patients %}
        <div class="border-2 rounded-md p-8 text-xl font-semibold text-[#0F766E]">
        <!-- {{patient}} -->
        <p>Name : {{patient.name}}</p>
        <p>Age : {{patient.age}}</p>
        </div>
    {% endfor %}
 </div> {% endcomment %}
 
 <div class="flex justify-center p-20">
     <form 
     method="post"
     class="grid gap-3 w-1/3 p-5 border rounded-md">
         <input
         type="text"
         name = "name"
         placeholder="name"
         >
         <input
         type="text"
         name = "age"
         placeholder="age"
         >
         <input
         type="text"
         name = "state"
         placeholder="state"
         >
         <button 
         class="py-2 bg-[#0F766E] rounded-lg text-white text-xl font-semibold "
         type="submit">Submit</button>
     </form>
 </div>

{% endblock %}
