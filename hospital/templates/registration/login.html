{% extends 'base.html' %}
{% block content %}
<style>
    input{
        border : 1px solid gray ;
        padding : 5px ;
        display : block ;
        width: 100%;
        border-radius: 5px;
    }
</style>

<div class="flex justify-center items-center">
    <form
    class="border border-gray-400 rounded-md grid gap-5 p-5 w-1/3  mt-20"
    method="POST">
        {% csrf_token %}
        <h2 class="text-4xl font-medium text-[#0F766E]">Login</h2>
    
        {{ form.as_p }}
    
        <button 
        class="bg-[#0F766E] py-2 mt-4 rounded-md text-white font-semibold"
        type="submit">Login</button>
        <a 
            class="font-semibold"
            href="{% url 'register' %}">You dont have an <span class="text-[#0F766E]">Account</span>?</a>
    </form>
</div>
{% endblock %}
